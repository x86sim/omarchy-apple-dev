[package]
name = "tauri-hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Tauri's mobile layout: the app is a library; iOS links its staticlib (rust/build.py: entry start_app)
name = "tauri_hello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
